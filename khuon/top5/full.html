<script>
window.__ready=false;
var MOC=__MOC__, CANH=__CANH__, TOP=__TOP__, DAI=__DAI__, NGAY=__NGAY__, MUC=__MUC__, DEM=__DEM__, NT=__NT__;
var TT=NT.tren, DD=NT.duoi;   // mep duoi vung giao dien tren / mep tren vung giao dien duoi cua nen tang
document.documentElement.style.setProperty('--T',TT+'px');
function cl(x){return x<0?0:x>1?1:x}
function p(t,a,d){return cl((t-a)/d)}
function eo(x){x=cl(x);return 1-Math.pow(1-x,3)}
function eo5(x){x=cl(x);return 1-Math.pow(1-x,5)}
function ei(x){x=cl(x);return x*x*x}
function eio(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function L(a,b,k){return a+(b-a)*k}
function $(i){return document.getElementById(i)}
function tf(el,s){el.style.transform=s}
function op(el,v){el.style.opacity=v>=1?'':String(Math.max(0,Math.min(.999,v)))}
function show(el,on){el.style.display=on?'':'none'}
function dau(t,a,from){var k=p(t,a,.14);if(t<a)return null;var s=k<1?L(from||2.2,1,eo5(k)):1;var r=p(t,a+.14,.3);var dx=r>0&&r<1?Math.sin(r*26)*14*(1-r):0;return [s,dx]}
function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tenGon(t){return t.replace(/®|™/g,'').replace(/ for PS5| full game/gi,'').replace(/ PS4 & PS5/gi,'').trim()}
var C={}; CANH.forEach(function(c){C[c.k]=c});
var CO={"Mỹ":"us.svg","Hồng Kông":"hk.svg","Singapore":"sg.svg"};
/* ===== MOC CHU THEO DOAN ===== */
var SOCHU=/^(một|hai|ba|bốn|năm|sáu|bảy|tám|chín|mười|mươi|trăm|lẻ|mốt|tư|lăm|nghìn)[.,!:]?$/i;
function tu(k){return MOC.filter(function(w){return w.doan===k})}
function moc(k){var ws=tu(k),o={};
  var ih=ws.findIndex(function(w){return /^hạng$/i.test(w.w)}); o.hang=ws[ih].s; o.so=ws[ih+1].s; o.ten=ws[ih+2].s;
  var ig=ws.findIndex(function(w){return /^giảm/i.test(w.w)}); o.giam=ig>=0?ws[ig].s:null;
  var ing=-1; ws.forEach(function(w,i){if(/^nghìn/i.test(w.w))ing=i}); var j=ing; while(j>0&&SOCHU.test(ws[j-1].w))j--; o.gia=ws[j].s;
  var io=ws.findIndex(function(w){return /^ở$/i.test(w.w)}); o.o=io>=0?ws[io].s:null; return o}
/* ===== MEP RACH (tren + duoi) ===== */
var R0=rnd(11),R1=rnd(29),JIT=[],JT=[];for(var x=0;x<=1080;x+=12){JIT.push([x,R0()*9+(R0()<.12?R0()*8:0)]);JT.push(R1()*8+(R1()<.1?R1()*6:0))}
var TOPB=TT+6;
function rach(H){var s='polygon(';for(var i=0;i<JIT.length;i++)s+=JIT[i][0]+'px '+(TOPB+JT[i]).toFixed(1)+'px,';
  for(var i=JIT.length-1;i>=0;i--)s+=JIT[i][0]+'px '+(H+JIT[i][1]).toFixed(1)+'px'+(i?',':'');return s+')'}
var C1=C.h5.a, CK=C.ket.a;
var HB={mo:TT+250, gon:TT+116, ket:Math.min(TT+1000,DD+12)};   // mep duoi khoi giay: bia / dai gon / trang ket
function hBand(t){ if(t<C1)return HB.mo; if(t<CK)return L(HB.mo,HB.gon,eio(p(t,C1-.3,.4))); return L(HB.gon,HB.ket,eo5(p(t,CK,.55))); }
var MAST={F:150,sm:.4}, TX=[0,0,0,0,0];
var CY=Math.round((TT+116+908)/2);   // tam vung trailer trong giua khoi dau trang va dai duoi: so to dap o day
var BIG=520/150, SLOT={};
function vua(el,max,co){el.style.fontSize=co+'px';var w=Math.max(el.getBoundingClientRect().width,el.scrollWidth);if(w>max)el.style.fontSize=(co*max/w)+'px'}   /* scrollWidth: .ten la khoi, rect = be rong CHA nen khong bao gio > max (K19) */
/* ten tren the hang: thu co chu cho vua 1 dong; < 34 px (kho doc tren dien thoai) -> xuong 2 dong 38 px, thu dan toi 30 px */
function vuaTen(el){var max=el.parentNode.getBoundingClientRect().width;vua(el,max,46);
  if(parseFloat(el.style.fontSize)<34){el.style.whiteSpace='normal';var k=38;el.style.fontSize=k+'px';el.style.lineHeight='1.02';while((el.scrollHeight>2*k*1.05||el.scrollWidth>max+1)&&k>30){k-=2;el.style.fontSize=k+'px'}}}
/* ===== DUNG CANH TU DU LIEU ===== */
(function(){
  var X=MUC/1000;
  $('ngay1').textContent='Ngày '+NGAY; $('ngay6').textContent='Bảng xếp hạng · Ngày '+NGAY; $('temX').textContent=X+'K';
  $('tit3').innerHTML='Top 5 bán chạy <i>dưới '+X+'K</i>'; $('con3').textContent='Còn '+DEM+' game nữa dưới '+X+'K:';
  // quat 5 bia: tu trai sang phai = hang 5 -> 1
  var h='',goc=[-16,-8,0,8,16],dx=[-200,-100,0,100,200],dy=[34,10,0,10,34];

  h='';

    h+='<div class="hang" id="h'+r+'">'+(r==1?'<div class="a sao1" id="sao1" style="left:'+(540-235)+'px;top:'+(CY-235)+'px"></div>':'')+
      '<div class="the nho2" id="the'+r+'" style="left:716px;top:736px;width:170px;height:186px;z-index:4"><img src="tai-san/bia'+r+'.png">'+(r==1?'<div class="quet" id="quet1"></div>':'')+'</div>'+
      '<div class="bang-keo" id="keo'+r+'" style="left:756px;top:718px;width:100px;height:34px;z-index:5"></div>'+
      '<div class="a nho tag" id="tag'+r+'">★ Top '+(g.hang_ban_chay<=50?50:100)+' bán chạy</div>'+
      '<div class="a bong" style="inset:0;pointer-events:none"><div class="a giay l3" id="hop'+r+'"><div class="slot" id="slot'+r+'"></div><div class="tt">'+
      '<div class="ten" id="ten'+r+'">'+tenGon(g.ten_the||g.ten)+'</div>'+
      '<div class="gia"><b id="gia'+r+'">'+g.gia+'</b><span class="giam" id="giam'+r+'">−'+g.giam+'%</span></div>'+
      '<div class="dong" id="dong'+r+'"><s>'+g.goc+'</s><span class="vung">'+(CO[g.vung]?'<img src="'+CO[g.vung]+'">':'')+g.vung.toUpperCase()+'</span><span class="may">'+g.may+'</span></div></div></div></div>'+
      '<div class="a soW" id="soW'+r+'"><div class="pf so'+(r==1?' vang':'')+'" id="so'+r+'">0'+r+'</div></div></div>'}
  $('hangs').innerHTML=h;
  // bang ket
  h='';for(var i=0;i<5;i++){var g=TOP[i];
    h+='<div class="dongK" id="dk'+i+'"><div class="r">'+(i+1)+'</div><img src="tai-san/bia'+(i+1)+'.png"><div class="t"><b>'+tenGon(g.ten)+'</b><span>−'+g.giam+'% · '+g.vung+'</span></div><div class="g">'+g.gia.replace('.000đ','K')+'</div></div>'}
  $('dongs').innerHTML=h;
  // trang ket: xep doc tu mep tren giay; hang thu hep neu nen tang chua it cho (Shorts) de logo khong lan vung duoi (LOI-SAI N12)
  var K0=TT+24, rong=DD-14-K0, rowH=Math.min(92,92+Math.floor((rong-945)/5));
  for(var i=0;i<5;i++)$('dk'+i).style.top=(K0+288+i*rowH)+'px';
