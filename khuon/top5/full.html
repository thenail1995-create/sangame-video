<script>
window.__ready=false;

function tenGon(t){return t.replace(/®|™/g,'').replace(/ for PS5| full game/gi,'').replace(/ PS4 & PS5/gi,'').trim()}

/* ===== MOC CHU THEO DOAN ===== */

  var ih=ws.findIndex(function(w){return /^hạng$/i.test(w.w)}); o.hang=ws[ih].s; o.so=ws[ih+1].s; o.ten=ws[ih+2].s;

  var ing=-1; ws.forEach(function(w,i){if(/^nghìn/i.test(w.w))ing=i}); var j=ing; while(j>0&&SOCHU.test(ws[j-1].w))j--; o.gia=ws[j].s;
  var io=ws.findIndex(function(w){return /^ở$/i.test(w.w)}); o.o=io>=0?ws[io].s:null; return o}
var CK=C.ket.a;
/* ===== HINH HOC ===== */
var VT=56, PEEK=10, STEP=300;             /* cards: khung cat y YP+56, cao 280; the truoi 300 px */
var Y0=1238, PITCH=49, BH=44, BARL=250, XLINE=886, TRACK=XLINE-BARL;   /* khoi so sanh: hang dau y 1238; BARL = mep trai thanh; XLINE = tam vach X */

/* ten tren the: toi da 2 dong; tran thi giam 0,5 px cho toi khi vua (K19) */

  function qua(){var r=document.createRange();r.selectNodeContents(el);var rs=r.getClientRects();var ys={};[].forEach.call(rs,function(q){ys[Math.round(q.top/4)]=1});return Object.keys(ys).length>2||el.scrollWidth>el.clientWidth+1}
  while(qua()&&c>30){c-=.5;el.style.fontSize=c+'px';el.style.lineHeight=(c*lh)+'px'}}
/* ===== DUNG TRANG TU DU LIEU ===== */

(function(){
  var X=MUC/1000;

  $('con3').textContent='Còn '+DEM+' game nữa dưới '+X+'K:';
  var h='<div class="card" id="intro" style="top:4px"><div class="a t1" id="phu1">5 game bán chạy · giá thẻ PSN</div><div class="a t2" id="ngay1">Ngày '+NGAY+'</div><div class="dim"></div></div>';
  for(var i=1;i<=5;i++){var r=6-i,g=TOP[r-1];
    h+='<div class="card l3" id="the'+r+'" style="top:'+(4+PEEK*Math.min(i,2))+'px">'+
      '<div class="a cv"><img src="tai-san/bia'+r+'.png"></div><div class="a so" id="so'+r+'">#'+r+'</div>'+
      '<div class="a tt"><div class="ten" id="ten'+r+'">'+tenGon(g.ten_the||g.ten)+'</div>'+
      '<div class="gia"><b id="gia'+r+'"></b><span class="giam" id="giam'+r+'">−'+g.giam+'%</span></div>'+
      '<div class="dong" id="dong'+r+'"><s>'+g.goc+'</s><span class="vung" id="vung'+r+'">'+(CO[g.vung]?'<img src="'+CO[g.vung]+'">':'')+g.vung.toUpperCase()+'</span><span class="may">'+g.may+'</span></div></div><div class="dim"></div></div>'}
  $('cards').innerHTML=h;
  /* 5 hang dua: tren xuong = hang 5 -> 1 */
  h='';
  for(var i=0;i<5;i++){var r=5-i,g=TOP[r-1],vk=g.gia.replace('.000đ','K'),W=giaSo(g)/MUC*TRACK;

      '<div class="a bar" id="bar'+r+'"><span class="v" id="v'+r+'">'+vk+'</span><div class="b1" id="soW'+r+'"><span class="v">'+vk+'</span></div><span class="chip" id="dk'+i+'">−'+g.giam+'%</span></div></div>'}
  $('chart').innerHTML=h;

})();
var M={}; [1,2,3,4,5].forEach(function(r){M[r]=moc('h'+r)});
/* moc cua the + hang so sanh (Hao 24/10): the hang r troi len 0,8 s, xong sau chu "Hang" 0,2 s; hang so sanh sang (#033, 0,5 s) tu chu "Hang" - 0,2 s */
var TON={}, RS={}, RE={}; [1,2,3,4,5].forEach(function(r){TON[r]=M[r].hang-.2; RS[r]=Math.max(.3,M[r].hang-.6); RE[r]=RS[r]+.8});
var DUR=.5;
/* count-up (#007, buoc 1.000d): bat dau luc the vua len (-0,2 s), cham dich TL >= 0,6 s truoc the ke (hoac trang ket); dai sang #022 chi chay khi con du cho */
var CNT={}; [1,2,3,4,5].forEach(function(r){var nxt=r>1?RS[r-1]:CK, cs=RE[r]-.2, tl=Math.min(RE[r]+2.25,nxt-.6); if(tl<cs+1.2)tl=cs+1.2; CNT[r]={cs:cs,tl:tl,sweep:tl+1.05<=nxt-.05}});
window.__LAND={}; [1,2,3,4,5].forEach(function(r){window.__LAND[r]=CNT[r].tl});
var KEYS=[[0,0]]; [5,4,3,2,1].forEach(function(r,i){KEYS.push([RS[r],i]);KEYS.push([RE[r],i+1])});
function scrollS(t){if(t<=KEYS[0][0])return KEYS[0][1];for(var i=1;i<KEYS.length;i++){if(t<KEYS[i][0]){var a=KEYS[i-1],b=KEYS[i];return a[1]===b[1]?a[1]:L(a[1],b[1],eio((t-a[0])/(b[0]-a[0])))}}return KEYS[KEYS.length-1][1]}
function fmt(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'đ'}
var PC={};
function setGia(r,str,tot){var el=$('gia'+r);if(PC[r]===str)return;PC[r]=str;var h='';for(var k=0;k<str.length;k++){var ch=str.charAt(k);h+='<span style="width:'+(ch==='.'?CW:ch==='đ'?DD:DW)+'px">'+ch+'</span>'}el.innerHTML=h;el.style.width=tot+'px'}
function totW(str){var w=0;for(var k=0;k<str.length;k++){var ch=str.charAt(k);w+=ch==='.'?CW:ch==='đ'?DD:DW}return w}
function shine(el,sx,w,h){/* dai sang 0,42 rad + dai manh 12 px cach 78 px (#022); gradient 90+24 do */
  var th=(90+24)*Math.PI/180, dx=Math.sin(th), dy=-Math.cos(th), Lg=Math.abs(w*dx)+Math.abs(h*dy), pos=function(x){return (x-w/2)*dx+Lg/2};
  var c=pos(sx), a=function(o){return (c+o).toFixed(1)+'px'};
  return 'linear-gradient(114deg,rgba(255,255,255,0) '+a(-58)+',rgba(255,255,255,.9) '+a(0)+',rgba(255,255,255,0) '+a(58)+'),linear-gradient(114deg,rgba(255,255,255,0) '+a(72)+',rgba(255,255,255,.6) '+a(78)+',rgba(255,255,255,.6) '+a(90)+',rgba(255,255,255,0) '+a(96)+')'}
/* ===== VE ===== */
function ve(t){
  op($('tit3'),1);
  var dt=dau(t,0,1.6); op($('tem200'),dt?1:0); if(dt)tf($('tem200'),'translateX('+dt[1]+'px) scale('+dt[0]+')');
  var xh=parseFloat($('xl').style.height); $('xl').style.clipPath='inset(0 0 '+(xh*(1-eo(p(t,-.2,.4))))+'px 0)';
  /* ----- chong the (#147): s = tien do cuon, the i len khi s tu i-1 toi i ----- */
  var s=scrollS(t), qk=p(t,CK-.1,.3), cards=$('cards'); window.__H=s*STEP+qk*STEP;
  var kitem=function(i,r){ var el=i===0?$('intro'):$('the'+r), rest=4+PEEK*Math.min(i,2), d=s-i, top;
    if(d<0){top=rest+(-d)*STEP}else{top=Math.max(4,rest-PEEK*Math.min(d,2))}
    var on=top<=280+4 && (i===0||t>=RS[r]-.05); show(el,on); if(!on)return top;
    var cov=cl(d), sc=1-.045*cov-.045*cl(d-1); tf(el,'translateY('+(top-rest)+'px) scale('+sc.toFixed(4)+')');
    el.querySelector('.dim').style.opacity=String(.16*cov);return top};
  kitem(0,0); [5,4,3,2,1].forEach(function(r,j){kitem(j+1,r)});
  var exit=eo(qk); op(cards,1-exit); tf(cards,'translateY('+(-18*exit)+'px)'); show(cards,t<CK+.35);
  /* ----- noi dung tung the ----- */
  [5,4,3,2,1].forEach(function(r){var el=$('the'+r); if(el.style.display==='none')return; var m=M[r],A=RE[r],cn=CNT[r],g=TOP[r-1];
    var bs=sp(t-(A-.1),15,6.5), rot=(1-sp(t-(A-.1),11,6))*-.35; op($('so'+r),bs>.002?1:0); tf($('so'+r),'rotate('+rot+'rad) scale('+Math.max(bs,.001)+')');
    $('ten'+r).style.clipPath='inset(-20px '+(100-eo(p(t,A-.15,.6))*100)+'% -20px 0)';
    var TG=giaSo(g)/1000, pc=p(t,cn.cs,cn.tl-cn.cs), land=t-cn.tl, vk=Math.round(TG*(.4+.6*f4(pc))), fin=t>=cn.tl, str=fin?g.gia:fmt(vk*1000);
    setGia(r,str,totW(g.gia)); var b=$('gia'+r), pop=land>0?1+.07*Math.exp(-7*land)*Math.cos(15*land):1;
    var aP=p(t,A-.2,.12); op(b,aP); 
    var sw=(cn.sweep&&land>0)?eios(p(land,0,1.05)):0, col=fin?'var(--vang)':'#fff';
    if(sw>0&&sw<1){var Wt=totW(g.gia); b.style.color='transparent'; b.style.backgroundImage=shine(b,L(-130,Wt+130,sw),Wt,84)+',linear-gradient('+col+','+col+')'; b.style.webkitBackgroundClip='text'; b.style.backgroundClip='text'}
    else{b.style.backgroundImage='none'; b.style.webkitBackgroundClip='border-box'; b.style.backgroundClip='border-box'; b.style.color=col}
    tf(b,'scale('+pop+')');
    var cs=sp(t-(A+.5),17,7); op($('giam'+r),cs>.002?1:0); tf($('giam'+r),'scale('+Math.max(cs,.001)+')');
    var ds=sp(t-(A+.7),17,7); op($('vung'+r),ds>.002?1:0); tf($('vung'+r),'scale('+Math.max(ds,.001)+')'); op($('dong'+r),p(t,A+.5,.2));
  });
  /* ----- khoi so sanh: 5 thanh moc (#002), hang r sang theo #033 ----- */
  for(var i=0;i<5;i++){var r=5-i,row=$('row'+r),W=+row.dataset.w;
