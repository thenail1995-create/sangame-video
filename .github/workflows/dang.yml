name: Dang video
# Lich that do cron-job.org goi workflow_dispatch (KHONG co `schedule`). Hai pha tach job:
#   chuan-bi (T-25 phut): kiem manifest+tai san+gia (job kiem) -> [IG/Threads: Pages deploy -> kiem URL] -> tai len / tao container
#     FB/YouTube KHONG phu thuoc Pages. Pages chi deploy SAU khi kiem noi dung dat.
#   cong-khai (T): publish kenh da chuan bi xong + TikTok hop thu -> ntfy
# Secret CHI o hai job chuan-bi / cong-khai. Token mang xa hoi nam o Supabase (qua cong sg-cong), khong o GitHub.
on:
  workflow_dispatch:
    inputs:
      pha:
        description: "chuan-bi hoac cong-khai"
        required: true
        type: choice
        options: [chuan-bi, cong-khai]
      dang:
        required: true
        type: choice
        options: [tin-nhanh, top5, keo-thom-2, keo-thom, keo-thom-3]
      ngay:
        description: "Ngay DANG (gio VN) YYYY-MM-DD. De trong = hom nay gio VN (lich cron-job.org gui rong)"
        required: false
        type: string
      che_do:
        required: true
        type: choice
        options: [thu, that]
      gio_bu:
        description: "DANG BU (de trong khi chay theo lich): HH:MM gio VN moi trong CUNG ngay - thay gio cua manifest cho chot som/tre + kiem gia"
        required: false
        type: string
permissions: {}
concurrency:
  # Moi pha 1 nhom; queue: max de dispatch moi KHONG thay the luot cong-khai dang cho (mac dinh chi giu 1 pending va huy cai cu)
  group: dang-${{ inputs.pha }}-${{ inputs.ngay }}-${{ inputs.dang }}-${{ inputs.che_do }}
  queue: max
env:
  SG_KENH_BAT: ${{ vars.SG_KENH_BAT }}   # 24/10/2026: rong = moi kenh; "youtube" = chi YouTube

jobs:
  kiem-dau-vao:
    # 24/10/2026: chi dang that cac dang trong SG_DANG_BAT
    if: github.ref == 'refs/heads/main' && (inputs.che_do != 'that' || vars.SG_DANG_BAT == '' || contains(format(',{0},', vars.SG_DANG_BAT), format(',{0},', inputs.dang)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Kiem dau vao
        env:
          NGAY: ${{ inputs.ngay }}
          DANG: ${{ inputs.dang }}
          CHE_DO: ${{ inputs.che_do }}
          DANG_BU_GIO: ${{ inputs.gio_bu }}
        run: |
          set -euo pipefail
          NGAY="${NGAY:-$(TZ=Asia/Ho_Chi_Minh date +%F)}"; [[ "$NGAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "ngay sai dinh dang"; exit 1; }
          [[ "$DANG" =~ ^(tin-nhanh|top5|keo-thom|keo-thom-2|keo-thom-3)$ ]] || { echo "dang sai"; exit 1; }
          [[ -z "$DANG_BU_GIO" || "$DANG_BU_GIO" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]$ ]] || { echo "gio_bu sai (HH:MM)"; exit 1; }
          [[ "$CHE_DO" =~ ^(thu|that)$ ]] || { echo "che_do sai"; exit 1; }

  # Kiem manifest + sha256 moi tai san + gia/han TRUOC khi cong khai bat ky thu gi (ke ca Pages). Sai -> bo khung + ntfy.
  kiem:
    if: inputs.pha == 'chuan-bi'
    needs: kiem-dau-vao
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Kiem noi dung
        env:
          SG_CONG_KHOA: ${{ secrets.SG_CONG_KHOA }}
          NTFY_TIN: ${{ secrets.NTFY_TIN }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NGAY: ${{ inputs.ngay }}
          DANG: ${{ inputs.dang }}
          CHE_DO: ${{ inputs.che_do }}
          DANG_BU_GIO: ${{ inputs.gio_bu }}
        run: python -m dang.chay --pha kiem --dang "$DANG" --ngay "${NGAY:-$(TZ=Asia/Ho_Chi_Minh date +%F)}" --che-do "$CHE_DO"

  # Mot job duy nhat dung site + deploy; MOT nhom chung cho ca repo, xep hang (queue: max) de khong lan nhau
  pages:
    if: inputs.pha == 'chuan-bi' && (vars.SG_KENH_BAT == '' || contains(format(',{0},', vars.SG_KENH_BAT), ',ig,'))
    needs: kiem
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: pages-sangame-video
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Dung site tu Release 2 ngay gan nhat (ban dich da kiem day du)
        id: dung
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NGAY: ${{ inputs.ngay }}
          DANG: ${{ inputs.dang }}
          CHE_DO: ${{ inputs.che_do }}
          DANG_BU_GIO: ${{ inputs.gio_bu }}
        run: python -m dang.site --ra _site --ngay "${NGAY:-$(TZ=Asia/Ho_Chi_Minh date +%F)}" --dang "$DANG" --che-do "$CHE_DO"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Kiem URL video (curl -sI = 200, khong 3xx, video/mp4)
        env:
          GOC: ${{ steps.deploy.outputs.page_url }}
          NGAY: ${{ inputs.ngay }}
          DANG: ${{ inputs.dang }}
          SHA8: ${{ steps.dung.outputs.sha8 }}
        run: |
          set -euo pipefail
          NGAY="${NGAY:-$(TZ=Asia/Ho_Chi_Minh date +%F)}"   # 11/10: lich cron-job.org gui ngay rong (thieu dong nay -> URL /v/-keo-thom-... 404)
          URL="${GOC%/}/v/${NGAY}-${DANG}-${SHA8}.mp4"
          for i in $(seq 1 12); do
            H="$(curl -sI --max-redirs 0 "$URL" || true)"
            CODE="$(printf '%s' "$H" | head -1 | awk '{print $2}')"
            CT="$(printf '%s' "$H" | tr -d '\r' | awk 'tolower($1)=="content-type:"{print tolower($2)}')"
            if [ "$CODE" = "200" ] && [ "$CT" = "video/mp4" ]; then echo "OK $URL"; exit 0; fi
            echo "lan $i: code=$CODE ct=$CT"; sleep 10
          done
          echo "URL khong dat: $URL"; exit 1

  # FB + YouTube: tai file thang tu Release, KHONG cho Pages
  chuan-bi-chung:
    if: inputs.pha == 'chuan-bi'
    needs: kiem
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Chuan bi FB + YouTube
        env:
          SG_CONG_KHOA: ${{ secrets.SG_CONG_KHOA }}
          NTFY_TIN: ${{ secrets.NTFY_TIN }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NGAY: ${{ inputs.ngay }}
          DANG: ${{ inputs.dang }}
          CHE_DO: ${{ inputs.che_do }}
          DANG_BU_GIO: ${{ inputs.gio_bu }}
        run: python -m dang.chay --pha chuan-bi --kenh fb,youtube --dang "$DANG" --ngay "${NGAY:-$(TZ=Asia/Ho_Chi_Minh date +%F)}" --che-do "$CHE_DO"

  # IG: can URL cong khai tren Pages (Threads het dang video tu 12/10 - xem threads-chu.yml)
  chuan-bi-pages:
    if: inputs.pha == 'chuan-bi' && (vars.SG_KENH_BAT == '' || contains(format(',{0},', vars.SG_KENH_BAT), ',ig,'))
    needs: [kiem, pages]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Chuan bi IG
        env:
          SG_CONG_KHOA: ${{ secrets.SG_CONG_KHOA }}
          NTFY_TIN: ${{ secrets.NTFY_TIN }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_URL: ${{ needs.pages.outputs.page_url }}
          NGAY: ${{ inputs.ngay }}
          DANG: ${{ inputs.dang }}
          CHE_DO: ${{ inputs.che_do }}
          DANG_BU_GIO: ${{ inputs.gio_bu }}
        run: python -m dang.chay --pha chuan-bi --kenh ig --dang "$DANG" --ngay "${NGAY:-$(TZ=Asia/Ho_Chi_Minh date +%F)}" --che-do "$CHE_DO"

  cong-khai:
    if: inputs.pha == 'cong-khai'
    needs: kiem-dau-vao
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # TikTok co the xoay refresh token: dung chung nhom voi gia-han.yml de khong ghi de nhau
    concurrency:
      group: token-tiktok
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Cong khai
        env:
          SG_CONG_KHOA: ${{ secrets.SG_CONG_KHOA }}
          ZERNIO_KHOA: ${{ secrets.ZERNIO_KHOA }}
          BUFFER_KHOA: ${{ secrets.BUFFER_KHOA }}
          NTFY_TIN: ${{ secrets.NTFY_TIN }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NGAY: ${{ inputs.ngay }}
          DANG: ${{ inputs.dang }}
          CHE_DO: ${{ inputs.che_do }}
          DANG_BU_GIO: ${{ inputs.gio_bu }}
        run: python -m dang.chay --pha cong-khai --dang "$DANG" --ngay "${NGAY:-$(TZ=Asia/Ho_Chi_Minh date +%F)}" --che-do "$CHE_DO"
