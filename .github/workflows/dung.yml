          GOI_KHOA: ${{ secrets.GOI_KHOA }}
        run: |
          set -euo pipefail
          [ -n "${GOI_KHOA:-}" ] || { echo "thieu secret GOI_KHOA - KHONG upload ban ro"; exit 1; }
          K="khuon/$KHUON"
          [ -f "$K/dau-vao/moc-chu.json" ] && [ -f "$K/dau-vao/giong.mp3" ] || { echo "thieu moc-chu.json / giong.mp3 sau job chung"; exit 1; }
          # moi tep KHONG nam trong git cua khuon (du lieu chon, giong, moc chu, trailer, nen-doan, am.wav, sfx-bus...) tru ban dung lai duoc / qua lon / chi de nhin
          git ls-files --others -z -- "$K" | { grep -zvE '(^|/)(soi|am-thanh|__pycache__)/|/lop-[^/]*\.mov$|\.build\.html$|/am-tho\.wav$|/do-thoi-gian[^/]*\.txt$|/tai-nguyen[^/]*\.txt$' || true; } > "$RUNNER_TEMP/chung.lst"
          [ -s "$RUNNER_TEMP/chung.lst" ] || { echo "danh sach tep chung rong"; exit 1; }
          tr '\0' '\n' < "$RUNNER_TEMP/chung.lst" | grep -E "^$K/([^/]+\.(json|txt)|kiem/tu-sua\.json|dau-vao/giong-nguon\.json)$" | tr '\n' '\0' > "$RUNNER_TEMP/meta.lst"
          [ -s "$RUNNER_TEMP/meta.lst" ] || { echo "danh sach tep meta rong"; exit 1; }
          tar --null -T "$RUNNER_TEMP/chung.lst" -cf "$RUNNER_TEMP/chung-ra.tar"
          tar --null -T "$RUNNER_TEMP/meta.lst" -cf "$RUNNER_TEMP/chung-meta.tar"
