        run: |
          set -euo pipefail
          SSIM_GIU=$PWD/go-loi/khung uv run -q --frozen python cong-cu/so-anh.py "khuon/$KHUON/video-$BAN.mp4" "du-lieu/video/fixture/$FIXTURE/ref" "$BAN" 0.97
      - name: Go loi - dong goi + ma hoa khung (chi khi go_loi)
        if: always() && github.event.inputs.go_loi == 'true'
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          [ -n "${ARTIFACT_KEY:-}" ] || { echo "thieu secret ARTIFACT_KEY - KHONG dong goi / upload go-loi (khoa rong van ma hoa duoc nhung ai cung giai ma duoc)"; exit 1; }
          mkdir -p go-loi/nen
          for t in 3 8 12 18 24; do
            ffmpeg -v error -y -ss "$t" -i "khuon/$KHUON/nen-$BAN.mp4" -frames:v 1 -vf scale=540:-2 "go-loi/nen/nen_${BAN}_${t}.png" || true
          done
          tar -cf - go-loi | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -out go-loi.enc
          ls -la go-loi.enc
      - name: Tai go-loi (da ma hoa)
        if: always() && github.event.inputs.go_loi == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-loi-${{ matrix.ban }}
          path: go-loi.enc
          retention-days: 1
          if-no-files-found: ignore
      - name: Dong goi + MA HOA ket qua ban (video, bia, bao cao kiem)
        env:
          GOI_KHOA: ${{ secrets.GOI_KHOA }}
        run: |
          set -euo pipefail
          [ -n "${GOI_KHOA:-}" ] || { echo "thieu secret GOI_KHOA - KHONG upload ban ro"; exit 1; }
          tar -C "khuon/$KHUON" -cf "$RUNNER_TEMP/kq-ban.tar" "video-$BAN.mp4" "bia-$BAN.jpg" "kiem/kiem-$BAN.json"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:GOI_KHOA -in "$RUNNER_TEMP/kq-ban.tar" -out "$GITHUB_WORKSPACE/kq-ban.enc"
          ls -la kq-ban.enc
      - name: Chuyen ket qua ban sang job gom (da ma hoa)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kq-ban-${{ matrix.ban }}
          path: kq-ban.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  gom:
    needs: [kiem-moi, chung, ban]
    if: "!cancelled() && github.ref == 'refs/heads/main' && needs.chung.result == 'success' && needs.chung.outputs.bo_khung != '1' && needs.ban.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      xong: ${{ steps.ket.outputs.xong }}
    env:
      DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
      KHUON: ${{ startsWith(github.event.inputs.dang || github.event.client_payload.dang, 'keo-thom') && 'keo-thom' || (github.event.inputs.dang || github.event.client_payload.dang) }}
      NGAY: ${{ needs.kiem-moi.outputs.ngay }}
      CHE_DO: ${{ github.event.inputs.che_do || github.event.client_payload.che_do || 'thu' }}
      LIVE: ${{ needs.kiem-moi.outputs.live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Du lieu rieng tu - ffprobe tinh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: video-tai-san
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: nang
          sparse-checkout: |
            video/tai-san/ffmpeg
          persist-credentials: false
      - name: ffprobe tinh (ghim sha256)
        run: |
          set -euo pipefail
          mkdir -p cong-cu/bin
          xz -dc nang/video/tai-san/ffmpeg/ffprobe.xz > cong-cu/bin/ffprobe
          (cd cong-cu/bin && grep ' ffprobe$' ../ffmpeg.sha256 | sha256sum -c)
          chmod +x cong-cu/bin/ffprobe
          echo "$PWD/cong-cu/bin" >> "$GITHUB_PATH"
      - name: Thong tin chung (da ma hoa)
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: chung-meta
          path: ket-qua/chung-meta
      - name: Ket qua 3 ban (da ma hoa)
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: kq-ban-*
          path: ket-qua
      - name: Giai ma vao khuon (thieu ban nao = loi)
        env:
          GOI_KHOA: ${{ secrets.GOI_KHOA }}
        run: |
          set -euo pipefail
          [ -n "${GOI_KHOA:-}" ] || { echo "thieu secret GOI_KHOA"; exit 1; }
          giai() { openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:GOI_KHOA -in "$1" | tar -xf - --no-same-owner -C "$2"; }
          giai ket-qua/chung-meta/chung-meta.enc "$GITHUB_WORKSPACE"
          for nt in tiktok reels shorts; do
            [ -f "ket-qua/kq-ban-$nt/kq-ban.enc" ] || { echo "THIEU ket qua ban $nt"; exit 1; }
            giai "ket-qua/kq-ban-$nt/kq-ban.enc" "khuon/$KHUON"
          done
          ls -la "khuon/$KHUON" "khuon/$KHUON/kiem"
      - name: Manifest (that bai neu thieu bao cao / phep truot)
        id: ket
        env:
          DATA_SHA: ${{ needs.chung.outputs.data_sha }}
          CODE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 cong-cu/manifest.py --khuon "khuon/$KHUON" --ra out --dang "$DANG" --ngay "$NGAY" --che-do "$CHE_DO"
          if [ "$LIVE" = "1" ]; then
            # moi dang co the co hook rieng (top5 / keo-thom); khong co (Tin nhanh) -> cong cu chung doc loi-dang.json + kiem-lai.json
            if [ -f "khuon/$KHUON/sau-manifest.py" ]; then python3 "khuon/$KHUON/sau-manifest.py" out/manifest.json
            else python3 cong-cu/sau_manifest_chung.py "khuon/$KHUON" out/manifest.json; fi
          fi
          ls -la out
          echo "xong=1" >> "$GITHUB_OUTPUT"
      - name: Chuyen ban dung sang job phat hanh (che do that, hoac thu + release_thu)
        if: success() && (env.CHE_DO == 'that' || github.event.inputs.release_thu == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ban-dung
          path: out/
          retention-days: 1
          if-no-files-found: error
  phat-hanh:
    needs: [kiem-moi, gom]
    # !cancelled(): Tin nhanh (1 pha) bo qua job chon -> khong co ham trang thai thi GitHub bo qua luon phat-hanh (CI 11/10 38113783849: 21/21 DAT ma khong co Release)
    if: "!cancelled() && github.ref == 'refs/heads/main' && needs.gom.result == 'success' && needs.gom.outputs.xong == '1' && (((github.event.inputs.che_do || github.event.client_payload.che_do) == 'that' && needs.kiem-moi.outputs.live == '1') || ((github.event.inputs.che_do || github.event.client_payload.che_do || 'thu') != 'that' && github.event.inputs.release_thu == 'true'))"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ban-dung
          path: out
      - name: Kiem manifest roi tao Release (DUNG 7 tai san cua HOP-DONG)
        env:
          GH_TOKEN: ${{ github.token }}
          NGAY: ${{ needs.kiem-moi.outputs.ngay }}
          DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
          KHUON: ${{ startsWith(github.event.inputs.dang || github.event.client_payload.dang, 'keo-thom') && 'keo-thom' || (github.event.inputs.dang || github.event.client_payload.dang) }}
          NHAP: ${{ github.event.inputs.ban_nhap || 'false' }}
          CHE_DO: ${{ github.event.inputs.che_do || github.event.client_payload.che_do || 'thu' }}
          LIVE: ${{ needs.kiem-moi.outputs.live }}
        run: |
          set -euo pipefail
          cd out
          ls
          python3 - <<'PY'
          import json,hashlib,os,sys
          m=json.load(open('manifest.json')); assert m['phien_ban']==1 and m['che_do']==os.environ['CHE_DO'] and m['ngay_dang']==os.environ['NGAY'] and m['dang']==os.environ['DANG']
          assert os.environ['CHE_DO']!='that' or os.environ['LIVE']=='1','che_do=that chi cho du lieu that (khong fixture)'
          cho={'manifest.json'}
          for nt,b in m['ban'].items():
              assert b['kiem']['dat'] is True and all(p['dat'] for p in b['kiem']['phep']),nt
              for k,s in (('video','sha256'),('bia','bia_sha256')):
                  assert hashlib.sha256(open(b[k],'rb').read()).hexdigest()==b[s],b[k]
                  cho.add(b[k])
          ld=m['loi_dang']; assert 0<len(ld['tieu_de'])<=100 and 0<len(ld['mo_ta'])<=2000 and ld['hashtag'] and ld['link'].startswith('https://sangame.com.vn'),ld
          assert set(os.listdir('.'))==cho and len(cho)==7,(sorted(os.listdir('.')),sorted(cho))
          print('manifest hop le, 7 tai san')
          PY
          if [ "$CHE_DO" = "that" ]; then TAG="v-${NGAY}-${DANG}"; FLAGS=(); else TAG="thu-${NGAY}-${DANG}"; FLAGS=(--prerelease); fi
          FLAGS+=(--title "$TAG" --notes "Ban dung tu dong ${DANG} ngay dang ${NGAY} (che do ${CHE_DO}). Chi gom video, bia, manifest.")
          if [ "$NHAP" = "true" ]; then FLAGS+=(--draft); fi
          gh release create "$TAG" "${FLAGS[@]}" video-tiktok.mp4 video-reels.mp4 video-shorts.mp4 bia-tiktok.jpg bia-reels.jpg bia-shorts.jpg manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          # A5 (Sol #21): tag/ban nhap phai tro DUNG commit da dung + kiem
          if [ "$NHAP" = "true" ]; then
            THAT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish)"
          else
            LOAI="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.type)"
            THAT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q .object.sha)"
            if [ "$LOAI" = "tag" ]; then THAT="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$THAT" -q .object.sha)"; fi
          fi
          if [ "$THAT" != "$GITHUB_SHA" ]; then
            echo "TAG $TAG tro $THAT, can $GITHUB_SHA -> xoa release vua tao"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
            exit 1
          fi
          echo "tag $TAG -> $GITHUB_SHA OK"
  bao-loi:
    needs: [kiem-moi, chon, chung, ban, gom, phat-hanh]
    if: always() && github.ref == 'refs/heads/main' && needs.kiem-moi.outputs.live == '1' && (github.event.inputs.che_do || github.event.client_payload.che_do) == 'that' && (needs.kiem-moi.result == 'failure' || needs.chon.result == 'failure' || needs.chung.result == 'failure' || needs.ban.result == 'failure' || needs.gom.result == 'failure' || needs.phat-hanh.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ntfy loi (kenh NTFY_BAO_LOI)
        env:
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
          KHUON: ${{ startsWith(github.event.inputs.dang || github.event.client_payload.dang, 'keo-thom') && 'keo-thom' || (github.event.inputs.dang || github.event.client_payload.dang) }}
          NGAY: ${{ needs.kiem-moi.outputs.ngay }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KQ: kiem-moi=${{ needs.kiem-moi.result }} chon=${{ needs.chon.result }} chung=${{ needs.chung.result }} ban=${{ needs.ban.result }} gom=${{ needs.gom.result }} phat-hanh=${{ needs.phat-hanh.result }}
        run: |
          python3 -c "import os,sys; from dang import ntfy; sys.exit(0 if ntfy.loi('Dung video that bai: '+os.environ['DANG'], 'Ngay '+os.environ['NGAY']+' ('+os.environ['KQ']+'). Xem '+os.environ['LINK'], click=os.environ['LINK']) else 1)"
