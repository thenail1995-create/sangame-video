name: Dung video
# A5: dung 1 dang video (3 ban TikTok/Reels/Shorts), kiem, va CHI KHI che_do=that + DAT HET moi tao Release cong khai.
# B5': che do TU DONG (fixture de trong; hien chi khuon co chuan-bi.sh = top5): kiem-moi (du lieu gia 6 vung co ngay hom nay chua? + lay data_sha)
#      -> chon (5 game + loi) -> dung (giong qua cong-cu/giong.py, dung, kiem D1-D3) -> phat-hanh. cron-job.org goi 10:15 (lan=1) va 10:45 (lan=2).
# Chi nhan workflow_dispatch / repository_dispatch; job dau kiem ref = main. Khong pull_request. Job dung KHONG co quyen ghi; chi job phat-hanh co contents:write.
on:
  workflow_dispatch:
    inputs:
      dang:
        description: Dang video
        type: choice
        options: [tin-nhanh, top5, keo-thom]
        required: true
      ngay:
        description: Ngay DANG (YYYY-MM-DD, gio VN). De trong = hom nay gio VN
        required: false
      che_do:
        description: thu = khong tao Release; that = tao Release neu DAT HET
        type: choice
        options: [thu, that]
        default: thu
      fixture:
        description: Ten fixture trong repo rieng tu (video/fixture/<ten>), vd top5-01. DE TRONG = che do TU DONG (du lieu that + giong that)
        required: false
      lan:
        description: Lan goi trong ngay (che do tu dong). 2 ma du lieu van chua moi = ntfy loi, bo khung
        type: choice
        options: ['1', '2']
        default: '1'
      bo_qua_do_moi:
        description: CHI che_do=thu - dung du lieu hien co du chua co ngay hom nay (in canh bao)
        type: boolean
        default: false
      data_sha:
        description: Commit repo rieng tu (de trong = main)
        required: false
      ep_truot:
        description: Co y lam TRUOT 1 phep kiem (chung minh khong ra Release)
        type: boolean
        default: false
      ban_nhap:
        description: Release o dang nhap (draft) - dung de thu
        type: boolean
        default: false
      go_loi:
        description: Luu khung SSIM + nen (MA HOA bang secret ARTIFACT_KEY) de xem khi SSIM thap
        type: boolean
        default: false
      release_thu:
        description: che_do=thu - van tao Release pre-release thu-<ngay>-<dang> (de thu may dang E5)
        type: boolean
        default: false
  repository_dispatch:
    types: [dung]
permissions: {}
# Cung dang chung 1 hang doi (lan 2 cho lan 1 xong roi thay Release da co -> khong dung lai)
concurrency:
  group: dung-${{ github.event.inputs.dang || github.event.client_payload.dang }}
  cancel-in-progress: false
jobs:
  kiem-moi:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      moi: ${{ steps.moi.outputs.moi }}
      live: ${{ steps.vao.outputs.live }}
      ba_pha: ${{ steps.kieu.outputs.ba_pha }}
      ngay: ${{ steps.vao.outputs.ngay }}
      data_sha: ${{ steps.moi.outputs.data_sha }}
    env:
      DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
      NGAY_IN: ${{ github.event.inputs.ngay || github.event.client_payload.ngay }}
      CHE_DO: ${{ github.event.inputs.che_do || github.event.client_payload.che_do || 'thu' }}
      FIXTURE: ${{ github.event.inputs.fixture || github.event.client_payload.fixture }}
      DATA_REF: ${{ github.event.inputs.data_sha || github.event.client_payload.data_sha || 'main' }}
      LAN: ${{ github.event.inputs.lan || github.event.client_payload.lan || '1' }}
    steps:
      - name: Kiem dau vao + ngay + che do tu dong
        id: vao
        run: |
          set -euo pipefail
          case "$DANG" in tin-nhanh|top5|keo-thom) ;; *) echo "dang khong hop le: $DANG"; exit 1;; esac
          # Tin nhanh dung luc 21:00 de dang 07:30 NGAY MAI (gio VN); Top 5 / Keo thom dang cung ngay
          if [ "$DANG" = "tin-nhanh" ]; then MAC_DINH="$(TZ=Asia/Ho_Chi_Minh date -d '+1 day' +%F)"; else MAC_DINH="$(TZ=Asia/Ho_Chi_Minh date +%F)"; fi
          NGAY="${NGAY_IN:-$MAC_DINH}"
          [[ "$NGAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "ngay khong hop le"; exit 1; }
          [[ "$FIXTURE" =~ ^[a-z0-9-]*$ ]] || { echo "fixture khong hop le"; exit 1; }
          [[ "$DATA_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "data_sha khong hop le"; exit 1; }
          case "$CHE_DO" in thu|that) ;; *) echo "che_do khong hop le"; exit 1;; esac
          case "$LAN" in 1|2) ;; *) echo "lan khong hop le"; exit 1;; esac
          if [ -z "$FIXTURE" ]; then LIVE=1; else LIVE=0; fi
          # ngay cua DU LIEU gia: Tin nhanh dung du lieu hom nay (= ngay dang - 1); dang khac: dung ngay dang
          if [ "$DANG" = "tin-nhanh" ]; then NGAY_DL="$(TZ=Asia/Ho_Chi_Minh date +%F)"; else NGAY_DL="$NGAY"; fi
          { echo "live=$LIVE"; echo "ngay=$NGAY"; echo "ngay_du_lieu=$NGAY_DL"; } >> "$GITHUB_OUTPUT"
          echo "dang=$DANG ngay=$NGAY che_do=$CHE_DO live=$LIVE lan=$LAN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Che do tu dong - chuan-bi.sh (3 pha) hay chon-tin.py (1 pha, Tin nhanh)"
        id: kieu
        if: steps.vao.outputs.live == '1'
        run: |
          set -euo pipefail
          if [ -f "khuon/$DANG/chuan-bi.sh" ]; then echo "ba_pha=1" >> "$GITHUB_OUTPUT"
          elif [ -f "khuon/$DANG/chon-tin.py" ]; then echo "ba_pha=0" >> "$GITHUB_OUTPUT"
          else echo "khuon $DANG chua ho tro che do tu dong (thieu chuan-bi.sh / chon-tin.py) - hay de fixture"; exit 1; fi
      - name: Du lieu rieng tu - chi du-lieu/ (kiem do moi)
        if: steps.vao.outputs.live == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: ${{ env.DATA_REF }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: du-lieu
          sparse-checkout: |
            du-lieu
          persist-credentials: false
      - name: Da co Release cua ngay nay chua (lan 2 khong dung lai)
        id: da
        if: steps.vao.outputs.live == '1' && env.CHE_DO == 'that'
        env:
          GH_TOKEN: ${{ github.token }}
          NGAY: ${{ steps.vao.outputs.ngay }}
        run: |
          set -euo pipefail
          if gh release view "v-${NGAY}-${DANG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "da=1" >> "$GITHUB_OUTPUT"; echo "Release v-${NGAY}-${DANG} da co -> khong dung lai"
          else
            echo "da=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Du lieu gia 6 vung co ngay hom nay chua (B5')
        id: moi
        env:
          LIVE: ${{ steps.vao.outputs.live }}
          DA: ${{ steps.da.outputs.da }}
          NGAY: ${{ steps.vao.outputs.ngay_du_lieu }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          BO_QUA: ${{ github.event.inputs.bo_qua_do_moi || 'false' }}
        run: |
          set -euo pipefail
          if [ "$LIVE" != "1" ]; then
            { echo "moi=1"; echo "data_sha=$DATA_REF"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${DA:-0}" = "1" ]; then
            { echo "moi=0"; echo "data_sha="; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          CO=()
          if [ "$BO_QUA" = "true" ]; then
            [ "$CHE_DO" = "thu" ] || { echo "bo_qua_do_moi chi duoc dung voi che_do=thu"; exit 1; }
            CO=(--bo-qua-do-moi)
          fi
          python3 cong-cu/kiem_do_moi.py du-lieu --ngay "$NGAY" --lan "$LAN" --github-output "${CO[@]}"
  chon:
    needs: kiem-moi
    if: github.ref == 'refs/heads/main' && needs.kiem-moi.outputs.live == '1' && needs.kiem-moi.outputs.ba_pha == '1' && needs.kiem-moi.outputs.moi == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      du: ${{ steps.chon.outputs.du }}
    env:
      DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
      NGAY: ${{ needs.kiem-moi.outputs.ngay }}
      GIO_DANG: ${{ (github.event.inputs.dang || github.event.client_payload.dang) == 'top5' && '12:00' || (github.event.inputs.dang || github.event.client_payload.dang) == 'tin-nhanh' && '07:30' || '20:00' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Du lieu rieng tu - du-lieu/ dung commit da kiem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: ${{ needs.kiem-moi.outputs.data_sha }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: du-lieu
          sparse-checkout: |
            du-lieu
          persist-credentials: false
      - name: uv (ban ghim; chon-keo.py can numpy + pillow theo uv.lock)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/pip" install --quiet uv==0.11.17
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: tesseract va ffmpeg (chon-keo.py - OCR anh giu cho, ffprobe doc trailer)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr ffmpeg
      - name: Chon game + loi doc (B1/B2)
        id: chon
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          UV_PYTHON_PREFERENCE: managed
          DU_LIEU_REPO: ${{ github.workspace }}/du-lieu
          CHE_DO: ${{ github.event.inputs.che_do || github.event.client_payload.che_do || 'thu' }}
        run: |
          set -uo pipefail
          bash "khuon/$DANG/chuan-bi.sh"; rc=$?
          if [ "$rc" = "3" ] || [ "$rc" = "4" ]; then   # 3 = khong chon duoc noi dung (bo khung + ntfy); 4 = da co Release hom nay (khong dung lai)
            echo "du=0" >> "$GITHUB_OUTPUT"
            cat "khuon/$DANG/ket-qua-chon.json" || true
            if [ "$CHE_DO" = "that" ] && [ "$rc" = "3" ]; then
              python3 -c "import json,os; from dang import ntfy; d=os.environ['DANG']; r=json.load(open('khuon/'+d+'/ket-qua-chon.json')); ntfy.loi(d+': khong chon duoc noi dung', 'Ngay '+os.environ['NGAY']+': '+str(r.get('ly_do'))+' -> bo khung '+d+'.')" || true
            fi
            exit 0
          fi
          [ "$rc" = "0" ] || exit "$rc"
          echo "du=1" >> "$GITHUB_OUTPUT"
          cat "khuon/$DANG/ket-qua-chon.json"; echo
      - name: Dong goi ket qua chon (game, loi, bia)
        if: steps.chon.outputs.du == '1'
        run: |
          set -euo pipefail
          cd "khuon/$DANG"
          [ -f chon-ra.txt ] || { echo "khuon $DANG thieu chon-ra.txt (danh sach tep ket qua chon)"; exit 1; }
          tar -cf "$GITHUB_WORKSPACE/chon-ra.tar" -T chon-ra.txt
      - name: Chuyen ket qua chon sang job dung
        if: steps.chon.outputs.du == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chon-ra
          path: chon-ra.tar
          retention-days: 1
          if-no-files-found: error
  dung:
    needs: [kiem-moi, chon]
    if: always() && github.ref == 'refs/heads/main' && needs.kiem-moi.result == 'success' && needs.kiem-moi.outputs.moi == '1' && (needs.kiem-moi.outputs.live != '1' || needs.kiem-moi.outputs.ba_pha != '1' || (needs.chon.result == 'success' && needs.chon.outputs.du == '1'))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      xong: ${{ steps.ket.outputs.xong }}
    env:
      DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
      NGAY: ${{ needs.kiem-moi.outputs.ngay }}
      CHE_DO: ${{ github.event.inputs.che_do || github.event.client_payload.che_do || 'thu' }}
      FIXTURE: ${{ github.event.inputs.fixture || github.event.client_payload.fixture }}
      FX_DIR: ${{ github.event.inputs.fixture || github.event.client_payload.fixture || 'khong-co' }}
      LIVE: ${{ needs.kiem-moi.outputs.live }}
      BA_PHA: ${{ needs.kiem-moi.outputs.ba_pha }}
      LICH_SU_NGAY: ${{ needs.kiem-moi.outputs.ngay }}
      DATA_REF: ${{ needs.kiem-moi.outputs.data_sha }}
      EP_TRUOT: ${{ github.event.inputs.ep_truot || 'false' }}
      GIONG_MUOI: ${{ (github.event.inputs.lan || github.event.client_payload.lan) == '2' && 'lan2' || '' }}
      GIO_DANG: ${{ (github.event.inputs.dang || github.event.client_payload.dang) == 'top5' && '12:00' || (github.event.inputs.dang || github.event.client_payload.dang) == 'tin-nhanh' && '07:30' || '20:00' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Du lieu rieng tu - phan nhe (SFX, giong, fixture nho)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: ${{ env.DATA_REF }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: du-lieu
          sparse-checkout: |
            video/tai-san
            video/fixture/${{ env.FX_DIR }}
            ${{ env.LIVE == '1' && 'du-lieu' || 'video/khong-co-du-lieu' }}
            ${{ env.LIVE == '1' && 'bai-viet' || 'video/khong-co-bai-viet' }}
          persist-credentials: false
      - name: Du lieu rieng tu - phan nang (trailer, ffmpeg)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: video-tai-san
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: nang
          sparse-checkout: |
            video/tai-san/ffmpeg
            video/fixture/${{ env.FX_DIR }}
          persist-credentials: false
      - name: ffmpeg tinh (ghim sha256)
        run: |
          set -euo pipefail
          mkdir -p cong-cu/bin
          for b in ffmpeg ffprobe; do
            xz -dc "nang/video/tai-san/ffmpeg/$b.xz" > "cong-cu/bin/$b"
          done
          (cd cong-cu/bin && sha256sum -c ../ffmpeg.sha256)
          chmod +x cong-cu/bin/*
          echo "$PWD/cong-cu/bin" >> "$GITHUB_PATH"
          cong-cu/bin/ffmpeg -version | head -1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Playwright (ban ghim trong package-lock) + Chromium
        run: |
          set -euo pipefail
          cd cong-cu && npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: tesseract (OCR bat anh giu cho PS Store - K18)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          tesseract --version | head -1
      - name: uv (ban ghim, cai bang pip trong venv, khong curl | sh)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/pip" install --quiet uv==0.11.17
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Cache mo hinh Whisper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/whisper-cache
          key: whisper-small-536b0662742c02347bc0e980a01041f333bce120
      - name: Lay tai san + fixture
        if: env.LIVE != '1'
        run: |
          set -euo pipefail
          bash lay-tai-san.sh "$DANG" "$FIXTURE" --data du-lieu --nang nang
      - name: Lay tai san (che do tu dong - chi tieng dong chung)
        if: env.LIVE == '1'
        run: |
          set -euo pipefail
          mkdir -p "khuon/$DANG/am-thanh"
          cp -R du-lieu/video/tai-san/am-thanh/. "khuon/$DANG/am-thanh/"
      - name: Ket qua chon game + loi (tu job chon)
        if: env.LIVE == '1' && env.BA_PHA == '1'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: chon-ra
          path: chon-ra
      - name: Giai nen ket qua chon vao khuon
        if: env.LIVE == '1' && env.BA_PHA == '1'
        run: |
          set -euo pipefail
          mkdir -p "khuon/$DANG/tai-san" "khuon/$DANG/dau-vao"
          tar -xf chon-ra/chon-ra.tar -C "khuon/$DANG"
          ls "khuon/$DANG"
      - name: Kho giong - khoi phuc (cung loi = cung khoa = 0 credit; lan 2 co muoi -> thu ban moi)
        id: gcache
        if: env.LIVE == '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: giong-kho
          key: giong-${{ env.DANG }}-${{ env.NGAY }}-${{ github.run_id }}
          restore-keys: |
            giong-${{ env.DANG }}-${{ env.NGAY }}-
      - name: "Thu giong (3 pha: giu cho credit -> doc-giong -> sap so; tran 20000/thang)"
        if: env.LIVE == '1' && env.BA_PHA == '1'
        env:
          GIONG_KHO: ${{ github.workspace }}/giong-kho
          SUPABASE_ANON_THENAIL: ${{ secrets.SUPABASE_ANON_THENAIL }}
          SG_CONG_KHOA: ${{ secrets.SG_CONG_KHOA }}
        run: |
          set -euo pipefail
          mkdir -p giong-kho "khuon/$DANG/dau-vao"
          python3 cong-cu/giong.py giong --loi-file "khuon/$DANG/loi.txt" --ra "khuon/$DANG/dau-vao/giong.mp3" --du-an san-game --dang "$DANG"
      - name: Kho giong - luu ngay sau khi thu (3 pha; job sau do co hong cung khong mat credit)
        if: env.LIVE == '1' && env.BA_PHA == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: giong-kho
          key: giong-${{ env.DANG }}-${{ env.NGAY }}-${{ github.run_id }}
      - name: "(chi de thu) Co y lam TRUOT 1 phep kiem"
        if: env.EP_TRUOT == 'true'
        run: |
          # shellcheck disable=SC2016
          # them 1 dong 'var ...; // tf($(...' vao cuoi full.html: phep 0 (chu thich nuot lenh) phai bat
          printf '\nvar zz=1; // tf($("x"),1)\n' >> "khuon/$DANG/full.html"
      - name: Dung + kiem
        id: dung
        env:
          WORKERS: '4'
          WHISPER_DIR: /home/runner/whisper-cache
          UV_PYTHON_PREFERENCE: managed
          # 1 pha (Tin nhanh): chay.sh tu chon tin + thu giong -> can nguon du lieu + khoa; 3 pha: giong da thu o buoc tren
          NGUON_DU_LIEU: ${{ env.LIVE == '1' && env.BA_PHA != '1' && format('{0}/du-lieu', github.workspace) || '' }}
          GIONG_KHO: ${{ github.workspace }}/giong-kho
          SUPABASE_ANON_THENAIL: ${{ env.LIVE == '1' && env.BA_PHA != '1' && secrets.SUPABASE_ANON_THENAIL || '' }}
          SG_CONG_KHOA: ${{ env.LIVE == '1' && env.BA_PHA != '1' && secrets.SG_CONG_KHOA || '' }}
        run: |
          set -euo pipefail
          nproc; free -g | head -2; df -h / | tail -1
          mkdir -p giong-kho
          # ma thoat 3 (khong du tin) / 4 (du lieu cu) cua chon-tin.py = BO KHUNG, khong phai loi may -> xanh + ntfy
          set +e; bash "khuon/$DANG/chay.sh"; rc=$?; set -e
          if [ "$LIVE" = "1" ] && [ "$BA_PHA" != "1" ] && { [ "$rc" = 3 ] || [ "$rc" = 4 ]; }; then
            echo "bo_khung=1" >> "$GITHUB_OUTPUT"
            { echo "ly_do<<EOF_LYDO"; tail -c 900 "khuon/$DANG/bo-khung.txt" 2>/dev/null || echo "ma thoat $rc"; echo "EOF_LYDO"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"
      - name: Bo khung - ntfy (che do that)
        if: steps.dung.outputs.bo_khung == '1' && env.CHE_DO == 'that'
        env:
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          LY_DO: ${{ steps.dung.outputs.ly_do }}
        run: |
          python3 -c "import os; from dang import ntfy; ntfy.loi(os.environ['DANG']+': bo khung', 'Ngay '+os.environ['NGAY']+': '+os.environ['LY_DO'][:800])"
      - name: Kho giong - luu (1 pha, ke ca khi kiem truot)
        if: always() && env.LIVE == '1' && env.BA_PHA != '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: giong-kho
          key: giong-${{ env.DANG }}-${{ env.NGAY }}-${{ github.run_id }}
      - name: Thoi gian + tai nguyen
        if: always()
        run: |
          cat "khuon/$DANG/do-thoi-gian.txt" 2>/dev/null || true
          df -h / | tail -1
      - name: So anh voi ban Mac (SSIM)
        if: success() && steps.dung.outputs.bo_khung != '1' && env.CHE_DO == 'thu' && env.LIVE != '1'
        run: |
          set -euo pipefail
          for nt in tiktok reels shorts; do
            SSIM_GIU=$PWD/go-loi/khung uv run -q --frozen python cong-cu/so-anh.py "khuon/$DANG/video-$nt.mp4" "du-lieu/video/fixture/$FIXTURE/ref" "$nt" 0.97
          done
      - name: Go loi - dong goi + ma hoa khung (chi khi go_loi)
        if: always() && github.event.inputs.go_loi == 'true'
        env:
          ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p go-loi/nen
          for nt in tiktok reels shorts; do
            for t in 3 8 12 18 24; do
              ffmpeg -v error -y -ss "$t" -i "khuon/$DANG/nen-$nt.mp4" -frames:v 1 -vf scale=540:-2 "go-loi/nen/nen_${nt}_${t}.png" || true
            done
          done
          tar -cf - go-loi | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_KEY -out go-loi.enc
          ls -la go-loi.enc
      - name: Tai go-loi (da ma hoa)
        if: always() && github.event.inputs.go_loi == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-loi
          path: go-loi.enc
          retention-days: 1
          if-no-files-found: ignore
      - name: Manifest (that bai neu thieu bao cao / phep truot)
        id: ket
        if: steps.dung.outputs.bo_khung != '1'
        run: |
          set -euo pipefail
          DATA_SHA="$(git -C du-lieu rev-parse HEAD)"   # commit that cua repo rieng tu (khong phai ten nhanh)
          export DATA_SHA
          export CODE_SHA="$GITHUB_SHA"
          uv run -q --frozen python cong-cu/manifest.py --khuon "khuon/$DANG" --ra out --dang "$DANG" --ngay "$NGAY" --che-do "$CHE_DO"
          if [ "$LIVE" = "1" ]; then
            # moi dang co the co hook rieng (top5 / keo-thom); khong co (Tin nhanh) -> cong cu chung doc loi-dang.json + kiem-lai.json
            if [ -f "khuon/$DANG/sau-manifest.py" ]; then uv run -q --frozen python "khuon/$DANG/sau-manifest.py" out/manifest.json
            else uv run -q --frozen python cong-cu/sau_manifest_chung.py "khuon/$DANG" out/manifest.json; fi
          fi
          ls -la out
          echo "xong=1" >> "$GITHUB_OUTPUT"
      - name: Chuyen ban dung sang job phat hanh (che do that, hoac thu + release_thu)
        if: success() && steps.dung.outputs.bo_khung != '1' && (env.CHE_DO == 'that' || github.event.inputs.release_thu == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ban-dung
          path: out/
          retention-days: 1
          if-no-files-found: error
  phat-hanh:
    needs: [kiem-moi, dung]
    if: github.ref == 'refs/heads/main' && needs.dung.result == 'success' && needs.dung.outputs.xong == '1' && ((github.event.inputs.che_do || github.event.client_payload.che_do) == 'that' || github.event.inputs.release_thu == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: ban-dung
          path: out
      - name: Kiem manifest roi tao Release (DUNG 7 tai san cua HOP-DONG)
        env:
          GH_TOKEN: ${{ github.token }}
          NGAY: ${{ needs.kiem-moi.outputs.ngay }}
          DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
          NHAP: ${{ github.event.inputs.ban_nhap || 'false' }}
          CHE_DO: ${{ github.event.inputs.che_do || github.event.client_payload.che_do || 'thu' }}
        run: |
          set -euo pipefail
          cd out
          ls
          python3 - <<'PY'
          import json,hashlib,os,sys
          m=json.load(open('manifest.json')); assert m['phien_ban']==1 and m['che_do']==os.environ['CHE_DO'] and m['ngay_dang']==os.environ['NGAY'] and m['dang']==os.environ['DANG']
          cho={'manifest.json'}
          for nt,b in m['ban'].items():
              assert b['kiem']['dat'] is True and all(p['dat'] for p in b['kiem']['phep']),nt
              for k,s in (('video','sha256'),('bia','bia_sha256')):
                  assert hashlib.sha256(open(b[k],'rb').read()).hexdigest()==b[s],b[k]
                  cho.add(b[k])
          ld=m['loi_dang']; assert 0<len(ld['tieu_de'])<=100 and 0<len(ld['mo_ta'])<=2000 and ld['hashtag'] and ld['link'].startswith('https://sangame.com.vn'),ld
          assert set(os.listdir('.'))==cho and len(cho)==7,(sorted(os.listdir('.')),sorted(cho))
          print('manifest hop le, 7 tai san')
          PY
          if [ "$CHE_DO" = "that" ]; then TAG="v-${NGAY}-${DANG}"; FLAGS=(); else TAG="thu-${NGAY}-${DANG}"; FLAGS=(--prerelease); fi
          FLAGS+=(--title "$TAG" --notes "Ban dung tu dong ${DANG} ngay dang ${NGAY} (che do ${CHE_DO}). Chi gom video, bia, manifest.")
          if [ "$NHAP" = "true" ]; then FLAGS+=(--draft); fi
          gh release create "$TAG" "${FLAGS[@]}" video-tiktok.mp4 video-reels.mp4 video-shorts.mp4 bia-tiktok.jpg bia-reels.jpg bia-shorts.jpg manifest.json --repo "$GITHUB_REPOSITORY"
  bao-loi:
    needs: [kiem-moi, chon, dung, phat-hanh]
    if: always() && github.ref == 'refs/heads/main' && needs.kiem-moi.outputs.live == '1' && (github.event.inputs.che_do || github.event.client_payload.che_do) == 'that' && (needs.kiem-moi.result == 'failure' || needs.chon.result == 'failure' || needs.dung.result == 'failure' || needs.phat-hanh.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ntfy loi (kenh NTFY_BAO_LOI)
        env:
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
          NGAY: ${{ needs.kiem-moi.outputs.ngay }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KQ: kiem-moi=${{ needs.kiem-moi.result }} chon=${{ needs.chon.result }} dung=${{ needs.dung.result }} phat-hanh=${{ needs.phat-hanh.result }}
        run: |
          python3 -c "import os; from dang import ntfy; ntfy.loi('Dung video that bai: '+os.environ['DANG'], 'Ngay '+os.environ['NGAY']+' ('+os.environ['KQ']+'). Xem '+os.environ['LINK'], click=os.environ['LINK'])"
