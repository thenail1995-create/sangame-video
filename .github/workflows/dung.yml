name: Dung video
# A5: dung 1 dang video (3 ban TikTok/Reels/Shorts), kiem, va CHI KHI che_do=that + DAT HET moi tao Release cong khai.
# SO DO JOB (11/10 dung nhanh): kiem-moi -> chon (3 pha) -> chung (giong, can chu, chon doan nen, khung cham, tieng, KIEM SOM - khong can hinh; truot = dung ngay)
#   -> ban x3 SONG SONG (matrix tiktok/reels/shorts: ma hoa nen, chup lop chu, ghep, bia, kiem DAY DU cua ban do)
#   -> gom (manifest tu 3 ban, hop dong 7 tai san) -> phat-hanh -> bao-loi. Artifact giua cac job chua giong/loi/anh => MA HOA bang GOI_KHOA (repo cong khai).
# B5': che do TU DONG (fixture de trong; hien chi khuon co chuan-bi.sh = top5): kiem-moi (du lieu gia 6 vung co ngay hom nay chua? + lay data_sha)
#      -> chon (5 game + loi) -> dung (giong qua cong-cu/giong.py, dung, kiem D1-D3) -> phat-hanh. cron-job.org goi 10:15 (lan=1) va 10:45 (lan=2).
# 14/10/2026 Hao chot "lam phuong an mien phi": lich tu dong quay ve may GitHub MIEN PHI ubuntu-24.04 (ket thuc thu Ubicloud 13-14/10).
# DOI MAY MAC DINH phai sua DUNG 4 CHO (khong chi default cua input):
#   (1) default cua input `may` (workflow_dispatch)
#   (2) fallback `runs-on: ${{ github.event.inputs.may || '...' }}` o 3 job chon, chung, ban
#   (3) fallback trong bieu thuc WORKERS o job chung
#   (4) fallback trong bieu thuc WORKERS o job ban
# Chung-ra di qua cache (cong-cu/nhan-chung-ra.sh kiem sha) truoc, artifact la du phong.
# Chi nhan workflow_dispatch / repository_dispatch; job dau kiem ref = main. Khong pull_request. Job dung KHONG co quyen ghi; chi job phat-hanh co contents:write.
on:
  workflow_dispatch:
    inputs:
      dang:
        description: Dang video
        type: choice
        options: [tin-nhanh, top5, keo-thom-2, keo-thom, keo-thom-3, flagship]
        required: true
      ngay:
        description: Ngay DANG (YYYY-MM-DD, gio VN). De trong = hom nay gio VN
        required: false
      che_do:
        description: thu = khong tao Release; that = tao Release neu DAT HET
        type: choice
        options: [thu, that]
        default: thu
      fixture:
        description: Ten fixture trong repo rieng tu (video/fixture/<ten>), vd top5-01. DE TRONG = che do TU DONG (du lieu that + giong that)
        required: false
      lan:
        description: Lan goi trong ngay (che do tu dong). 2 ma du lieu van chua moi = ntfy loi, bo khung
        type: choice
        options: ['1', '2']
        default: '1'
      bo_qua_do_moi:
        description: CHI che_do=thu - dung du lieu hien co du chua co ngay hom nay (in canh bao)
        type: boolean
        default: false
      data_sha:
        description: Commit repo rieng tu (de trong = main)
        required: false
      ep_truot:
        description: Co y lam TRUOT 1 phep kiem (chung minh khong ra Release)
        type: boolean
        default: false
      ban_nhap:
        description: Release o dang nhap (draft) - dung de thu
        type: boolean
        default: false
      go_loi:
        description: Luu khung SSIM + nen (MA HOA bang secret ARTIFACT_KEY) de xem khi SSIM thap
        type: boolean
        default: false
      release_thu:
        description: che_do=thu - van tao Release pre-release thu-<ngay>-<dang> (de thu may dang E5)
        type: boolean
        default: false
      may:
        description: May cho 3 job nang (chon, chung, ban). Mac dinh ubuntu-24.04 = may GitHub MIEN PHI (repo cong khai, 4 nhan); ubicloud-standard-8 = 8 nhan, tinh tien, chi khi can gap
        type: choice
        options: [ubuntu-24.04, ubicloud-standard-8]
        default: ubuntu-24.04
  repository_dispatch:
    types: [dung]
permissions: {}
# Cung KHUON chung 1 hang doi (lan 2 cho lan 1 xong roi thay Release da co -> khong dung lai). Ba khung Keo (keo-thom-2/keo-thom/keo-thom-3) cung nhom
# `dung-keo-thom` de cac luot Keo chay TUAN TU toi luc tao Release (chon-keo.py doc lich su Release -> hai luot chong nhau co the chon cung 1 game).
# Luu y: GitHub chi giu 1 luot CHO moi group (luot cho moi hon thay luot cho cu) - lich dung 13:00 / 17:30 / 20:30 khong chong nhau (moi luot ~17 phut).
concurrency:
  group: dung-${{ startsWith(github.event.inputs.dang || github.event.client_payload.dang, 'keo-thom') && 'keo-thom' || (github.event.inputs.dang || github.event.client_payload.dang) }}
  cancel-in-progress: false
jobs:
  kiem-moi:
    # 24/10/2026: chi chay that cac dang trong bien repo SG_DANG_BAT (vd "top5"); lich cron-job.org cu van goi het
    if: github.ref == 'refs/heads/main' && ((github.event.inputs.che_do || github.event.client_payload.che_do || 'thu') != 'that' || vars.SG_DANG_BAT == '' || contains(format(',{0},', vars.SG_DANG_BAT), format(',{0},', github.event.inputs.dang || github.event.client_payload.dang)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      moi: ${{ steps.moi.outputs.moi }}
      live: ${{ steps.vao.outputs.live }}
      ba_pha: ${{ steps.kieu.outputs.ba_pha }}
      ngay: ${{ steps.vao.outputs.ngay }}
      data_sha: ${{ steps.moi.outputs.data_sha }}
    env:
      DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
      KHUON: ${{ startsWith(github.event.inputs.dang || github.event.client_payload.dang, 'keo-thom') && 'keo-thom' || (github.event.inputs.dang || github.event.client_payload.dang) }}
      NGAY_IN: ${{ github.event.inputs.ngay || github.event.client_payload.ngay }}
      CHE_DO: ${{ github.event.inputs.che_do || github.event.client_payload.che_do || 'thu' }}
      FIXTURE: ${{ github.event.inputs.fixture || github.event.client_payload.fixture }}
      DATA_REF: ${{ github.event.inputs.data_sha || github.event.client_payload.data_sha || 'main' }}
      LAN: ${{ github.event.inputs.lan || github.event.client_payload.lan || '1' }}
    steps:
      - name: Kiem dau vao + ngay + che do tu dong
        id: vao
        run: |
          set -euo pipefail
          case "$DANG" in tin-nhanh|top5|keo-thom|keo-thom-2|keo-thom-3|flagship) ;; *) echo "dang khong hop le: $DANG"; exit 1;; esac
          # Tin nhanh dung luc 21:00 de dang 07:30 NGAY MAI (gio VN); Top 5 / Keo thom dang cung ngay
          if [ "$DANG" = "tin-nhanh" ]; then MAC_DINH="$(TZ=Asia/Ho_Chi_Minh date -d '+1 day' +%F)"; else MAC_DINH="$(TZ=Asia/Ho_Chi_Minh date +%F)"; fi
          NGAY="${NGAY_IN:-$MAC_DINH}"
          [[ "$NGAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "ngay khong hop le"; exit 1; }
          [[ "$FIXTURE" =~ ^[a-z0-9-]*$ ]] || { echo "fixture khong hop le"; exit 1; }
          [[ "$DATA_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "data_sha khong hop le"; exit 1; }
          case "$CHE_DO" in thu|that) ;; *) echo "che_do khong hop le"; exit 1;; esac
          case "$LAN" in 1|2) ;; *) echo "lan khong hop le"; exit 1;; esac
          if [ -z "$FIXTURE" ]; then LIVE=1; else LIVE=0; fi
          # A4 (Sol #1): fixture KHONG BAO GIO duoc di cung che_do=that (fixture tu cho freshness dat + bo hook chan mau hoi quy)
          if [ -n "$FIXTURE" ] && [ "$CHE_DO" = "that" ]; then echo "CAM: fixture + che_do=that"; exit 1; fi
          # ngay cua DU LIEU gia: Tin nhanh dung du lieu hom nay (= ngay dang - 1); dang khac: dung ngay dang
          if [ "$DANG" = "tin-nhanh" ]; then NGAY_DL="$(date -d "$NGAY -1 day" +%F)"; else NGAY_DL="$NGAY"; fi
          { echo "live=$LIVE"; echo "ngay=$NGAY"; echo "ngay_du_lieu=$NGAY_DL"; } >> "$GITHUB_OUTPUT"
          echo "dang=$DANG ngay=$NGAY che_do=$CHE_DO live=$LIVE lan=$LAN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Che do tu dong - chuan-bi.sh (3 pha) hay chon-tin.py (1 pha, Tin nhanh)"
        id: kieu
        if: steps.vao.outputs.live == '1'
        run: |
          set -euo pipefail
          if [ -f "khuon/$KHUON/chuan-bi.sh" ]; then echo "ba_pha=1" >> "$GITHUB_OUTPUT"
          elif [ -f "khuon/$KHUON/chon-tin.py" ]; then echo "ba_pha=0" >> "$GITHUB_OUTPUT"
          else echo "khuon $KHUON chua ho tro che do tu dong (thieu chuan-bi.sh / chon-tin.py) - hay de fixture"; exit 1; fi
      - name: Du lieu rieng tu - chi du-lieu/ (kiem do moi)
        if: steps.vao.outputs.live == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: ${{ env.DATA_REF }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: du-lieu
          sparse-checkout: |
            du-lieu
          persist-credentials: false
      - name: Da co Release cua ngay nay chua (lan 2 khong dung lai)
        id: da
        if: steps.vao.outputs.live == '1' && env.CHE_DO == 'that'
        env:
          GH_TOKEN: ${{ github.token }}
          NGAY: ${{ steps.vao.outputs.ngay }}
        run: |
          set -euo pipefail
          if gh release view "v-${NGAY}-${DANG}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "da=1" >> "$GITHUB_OUTPUT"; echo "Release v-${NGAY}-${DANG} da co -> khong dung lai"
          else
            echo "da=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Du lieu gia 6 vung co ngay hom nay chua (B5')
        id: moi
        env:
          LIVE: ${{ steps.vao.outputs.live }}
          DA: ${{ steps.da.outputs.da }}
          NGAY: ${{ steps.vao.outputs.ngay_du_lieu }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          BO_QUA: ${{ github.event.inputs.bo_qua_do_moi || 'false' }}
        run: |
          set -euo pipefail
          if [ "$LIVE" != "1" ]; then
            { echo "moi=1"; echo "data_sha=$DATA_REF"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${DA:-0}" = "1" ]; then
            { echo "moi=0"; echo "data_sha="; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          CO=()
          if [ "$BO_QUA" = "true" ]; then
            [ "$CHE_DO" = "thu" ] || { echo "bo_qua_do_moi chi duoc dung voi che_do=thu"; exit 1; }
            CO=(--bo-qua-do-moi)
          fi
          # luot cuoi (khong con luot sau): top5 lan=2; keo-thom, tin-nhanh luon
          if [ "$DANG" != "top5" ] || [ "$LAN" = "2" ]; then CO+=(--lan-cuoi); fi
          python3 cong-cu/kiem_do_moi.py du-lieu --ngay "$NGAY" --dang "$DANG" --github-output "${CO[@]}"
  chon:
    needs: kiem-moi
    if: github.ref == 'refs/heads/main' && needs.kiem-moi.outputs.live == '1' && needs.kiem-moi.outputs.ba_pha == '1' && needs.kiem-moi.outputs.moi == '1'
    runs-on: ${{ github.event.inputs.may || 'ubuntu-24.04' }}
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      du: ${{ steps.chon.outputs.du }}
    env:
      DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
      KHUON: ${{ startsWith(github.event.inputs.dang || github.event.client_payload.dang, 'keo-thom') && 'keo-thom' || (github.event.inputs.dang || github.event.client_payload.dang) }}
      NGAY: ${{ needs.kiem-moi.outputs.ngay }}
      GIO_DANG: ${{ (github.event.inputs.dang || github.event.client_payload.dang) == 'top5' && '12:00' || (github.event.inputs.dang || github.event.client_payload.dang) == 'tin-nhanh' && '07:30' || (github.event.inputs.dang || github.event.client_payload.dang) == 'keo-thom-2' && '15:00' || (github.event.inputs.dang || github.event.client_payload.dang) == 'keo-thom-3' && '22:00' || (github.event.inputs.dang || github.event.client_payload.dang) == 'flagship' && '15:30' || '20:00' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Du lieu rieng tu - du-lieu/ dung commit da kiem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: ${{ needs.kiem-moi.outputs.data_sha }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: du-lieu
          sparse-checkout: |
            du-lieu
          persist-credentials: false
      - name: Bang keo hang ngay (nhanh san-deal cua repo rieng tu) - chi khuon flagship
        if: env.KHUON == 'flagship'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: san-deal
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: keo-du-lieu
          sparse-checkout: |
            keo
          persist-credentials: false
      - name: Khoa cache apt (doi moi tuan)
        id: apt
        run: echo "tuan=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache .deb tesseract + ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: apt-deb-tesseract-ffmpeg-ubuntu-24.04-${{ steps.apt.outputs.tuan }}
      - name: tesseract va ffmpeg (chon-keo.py - OCR anh giu cho, ffprobe doc trailer) tu cache .deb, thieu thi apt
        run: |
          set -euo pipefail
          D="$HOME/apt-debs"; mkdir -p "$D"
          if compgen -G "$D/*.deb" >/dev/null && sudo apt-get install -y -qq "$D"/*.deb >/dev/null 2>&1; then
            echo "tesseract + ffmpeg tu cache .deb"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --download-only -o Dir::Cache::archives="$D" tesseract-ocr ffmpeg
            sudo chmod -R a+rX "$D"; sudo find "$D" -mindepth 1 ! -name '*.deb' -delete 2>/dev/null || true
            sudo apt-get install -y -qq tesseract-ocr ffmpeg
          fi
          tesseract --version | head -1
      - name: uv (ban ghim; chon-keo.py can numpy + pillow theo uv.lock)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/uvenv"
          "$RUNNER_TEMP/uvenv/bin/pip" install --quiet uv==0.11.17
          echo "$RUNNER_TEMP/uvenv/bin" >> "$GITHUB_PATH"
      - name: Cache uv (goi Python khoa theo uv.lock)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/python
          key: uv-${{ runner.os }}-0.11.17-${{ hashFiles('uv.lock') }}
      - name: Chon game + loi doc (B1/B2)
        id: chon
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          UV_PYTHON_PREFERENCE: managed
          DU_LIEU_REPO: ${{ github.workspace }}/du-lieu
          KEO_DIR: ${{ github.workspace }}/keo-du-lieu
          CHE_DO: ${{ github.event.inputs.che_do || github.event.client_payload.che_do || 'thu' }}
        run: |
          set -uo pipefail
          rc=0; bash "khuon/$KHUON/chuan-bi.sh" || rc=$?   # shell GitHub chay bash -e: phai bat ma thoat kieu nay, khong thi 3/4 lam do job (11/10 run 38149526532)
          if [ "$rc" = "3" ] || [ "$rc" = "4" ]; then   # 3 = khong chon duoc noi dung (bo khung + ntfy); 4 = da co Release hom nay (khong dung lai)
            echo "du=0" >> "$GITHUB_OUTPUT"
            cat "khuon/$KHUON/ket-qua-chon.json" || true
            if [ "$CHE_DO" = "that" ] && [ "$rc" = "3" ]; then
              python3 -c "import json,os,sys; from dang import ntfy; d=os.environ['DANG']; r=json.load(open('khuon/'+os.environ['KHUON']+'/ket-qua-chon.json')); sys.exit(0 if ntfy.loi(d+': khong chon duoc noi dung', 'Ngay '+os.environ['NGAY']+': '+str(r.get('ly_do'))+' -> bo khung '+d+'.') else 1)" || { echo "gui ntfy bo khung THAT BAI"; exit 1; }
            fi
            exit 0
          fi
          [ "$rc" = "0" ] || exit "$rc"
          echo "du=1" >> "$GITHUB_OUTPUT"
          cat "khuon/$KHUON/ket-qua-chon.json"; echo
      - name: Dong goi + MA HOA ket qua chon (game, loi, bia) - repo cong khai, artifact tai duoc
        if: steps.chon.outputs.du == '1'
        env:
          GOI_KHOA: ${{ secrets.GOI_KHOA }}
        run: |
          set -euo pipefail
          [ -n "${GOI_KHOA:-}" ] || { echo "thieu secret GOI_KHOA - KHONG upload ban ro"; exit 1; }
          cd "khuon/$KHUON"
          [ -f chon-ra.txt ] || { echo "khuon $KHUON thieu chon-ra.txt (danh sach tep ket qua chon)"; exit 1; }
          tar -cf "$RUNNER_TEMP/chon-ra.tar" -T chon-ra.txt
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:GOI_KHOA -in "$RUNNER_TEMP/chon-ra.tar" -out "$GITHUB_WORKSPACE/chon-ra.enc"
          ls -la "$GITHUB_WORKSPACE/chon-ra.enc"
      - name: Chuyen ket qua chon sang job dung
        if: steps.chon.outputs.du == '1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chon-ra
          path: chon-ra.enc
          retention-days: 1
          if-no-files-found: error
  chung:
    needs: [kiem-moi, chon]
    if: always() && github.ref == 'refs/heads/main' && needs.kiem-moi.result == 'success' && needs.kiem-moi.outputs.moi == '1' && (needs.kiem-moi.outputs.live != '1' || needs.kiem-moi.outputs.ba_pha != '1' || (needs.chon.result == 'success' && needs.chon.outputs.du == '1'))
    runs-on: ${{ github.event.inputs.may || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      bo_khung: ${{ steps.dung.outputs.bo_khung }}
      data_sha: ${{ steps.dsha.outputs.sha }}
      chung_sha: ${{ steps.sha_chung.outputs.sha }}
    env:
      DANG: ${{ github.event.inputs.dang || github.event.client_payload.dang }}
      KHUON: ${{ startsWith(github.event.inputs.dang || github.event.client_payload.dang, 'keo-thom') && 'keo-thom' || (github.event.inputs.dang || github.event.client_payload.dang) }}
      NGAY: ${{ needs.kiem-moi.outputs.ngay }}
      CHE_DO: ${{ github.event.inputs.che_do || github.event.client_payload.che_do || 'thu' }}
      FIXTURE: ${{ github.event.inputs.fixture || github.event.client_payload.fixture }}
      FX_DIR: ${{ github.event.inputs.fixture || github.event.client_payload.fixture || 'khong-co' }}
      LIVE: ${{ needs.kiem-moi.outputs.live }}
      BA_PHA: ${{ needs.kiem-moi.outputs.ba_pha }}
      LICH_SU_NGAY: ${{ needs.kiem-moi.outputs.ngay }}
      DATA_REF: ${{ needs.kiem-moi.outputs.data_sha }}
      EP_TRUOT: ${{ github.event.inputs.ep_truot || 'false' }}
      GIONG_MUOI: ${{ (github.event.inputs.lan || github.event.client_payload.lan) == '2' && 'lan2' || '' }}
      GIO_DANG: ${{ (github.event.inputs.dang || github.event.client_payload.dang) == 'top5' && '12:00' || (github.event.inputs.dang || github.event.client_payload.dang) == 'tin-nhanh' && '07:30' || (github.event.inputs.dang || github.event.client_payload.dang) == 'keo-thom-2' && '15:00' || (github.event.inputs.dang || github.event.client_payload.dang) == 'keo-thom-3' && '22:00' || (github.event.inputs.dang || github.event.client_payload.dang) == 'flagship' && '15:30' || '20:00' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Du lieu rieng tu - phan nhe (SFX, giong, fixture nho)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: ${{ env.DATA_REF }}
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: du-lieu
          sparse-checkout: |
            video/tai-san
            video/fixture/${{ env.FX_DIR }}
            ${{ env.LIVE == '1' && 'du-lieu' || 'video/khong-co-du-lieu' }}
            ${{ env.LIVE == '1' && 'bai-viet' || 'video/khong-co-bai-viet' }}
          persist-credentials: false
      - name: Du lieu rieng tu - phan nang (trailer, ffmpeg)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: thenail1995-create/kenh-game-du-lieu
          ref: video-tai-san
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: nang
          sparse-checkout: |
            video/tai-san/ffmpeg
            video/fixture/${{ env.FX_DIR }}
          persist-credentials: false
      - name: ffmpeg tinh (ghim sha256)
        run: |
          set -euo pipefail
          mkdir -p cong-cu/bin
          for b in ffmpeg ffprobe; do
            xz -dc "nang/video/tai-san/ffmpeg/$b.xz" > "cong-cu/bin/$b"
          done
          (cd cong-cu/bin && sha256sum -c ../ffmpeg.sha256)
          chmod +x cong-cu/bin/*
          echo "$PWD/cong-cu/bin" >> "$GITHUB_PATH"
          cong-cu/bin/ffmpeg -version | head -1
      - name: Khoa cache apt (doi moi tuan)
        id: apt
