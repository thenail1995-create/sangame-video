          WHISPER_DIR: /home/runner/whisper-cache
          # chi khi chay fixture (hoi quy): bo kiem ngay du lieu theo NGAY (khuon/*/kiem). Khong fixture (LIVE) = khong dat. fixture + che_do=that da bi cam o kiem-moi.
          HOI_QUY: ${{ env.FIXTURE != '' && '1' || '' }}
