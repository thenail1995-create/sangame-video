          NGUON_DU_LIEU: ${{ env.LIVE == '1' && env.BA_PHA != '1' && format('{0}/du-lieu', github.workspace) || '' }}
          GIONG_KHO: ${{ runner.temp }}/giong-kho
          SUPABASE_ANON_THENAIL: ${{ env.LIVE == '1' && env.BA_PHA != '1' && secrets.SUPABASE_ANON_THENAIL || '' }}
          THENAIL_KHOA_GIONG: ${{ env.LIVE == '1' && env.BA_PHA != '1' && secrets.THENAIL_KHOA_GIONG || '' }}
          SG_CONG_KHOA: ${{ env.LIVE == '1' && env.BA_PHA != '1' && secrets.SG_CONG_KHOA || '' }}
        run: |
          set -euo pipefail
          nproc; free -g | head -2; df -h / | tail -1
          mkdir -p "$GIONG_KHO"
          # ma thoat 3 (khong du tin) / 4 (du lieu cu) cua chon-tin.py = BO KHUNG, khong phai loi may -> xanh + ntfy
          set +e; bash "khuon/$KHUON/chay.sh"; rc=$?; set -e
          if [ "$LIVE" = "1" ] && [ "$BA_PHA" != "1" ] && { [ "$rc" = 3 ] || [ "$rc" = 4 ]; }; then
            echo "bo_khung=1" >> "$GITHUB_OUTPUT"
            { echo "ly_do<<EOF_LYDO"; tail -c 900 "khuon/$KHUON/bo-khung.txt" 2>/dev/null || echo "ma thoat $rc"; echo "EOF_LYDO"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"
