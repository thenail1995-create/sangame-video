          df -h / | tail -1
      - name: Commit that cua repo rieng tu (manifest.sha_du_lieu)
        id: dsha
        run: echo "sha=$(git -C du-lieu rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Dong goi + MA HOA ket qua chung (giong tho, loi, anh Sony, nen) - repo cong khai, artifact tai duoc
