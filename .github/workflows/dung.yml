          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          LY_DO: ${{ steps.dung.outputs.ly_do }}
        run: |
          python3 -c "import os,sys; from dang import ntfy; sys.exit(0 if ntfy.loi(os.environ['DANG']+': bo khung', 'Ngay '+os.environ['NGAY']+': '+os.environ['LY_DO'][:800]) else 1)"
      - name: Thoi gian + tai nguyen
        if: always()
        run: |
