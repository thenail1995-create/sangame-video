name: Quet bi mat (gitleaks)
# Quet lai toan bo lich su sau moi push vao main (hook cuc bo la hang rao dau).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  gitleaks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tai gitleaks (ghim phien ban + sha256, khong curl | sh)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -fsSL -o gl.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl" && tar -xzf gl.tar.gz -C "$RUNNER_TEMP/gl" gitleaks
      - name: Quet lich su
        run: |
          "$RUNNER_TEMP/gl/gitleaks" git --no-banner --redact --verbose .
