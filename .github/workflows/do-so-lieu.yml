name: Do so lieu
# cron-job.org goi workflow_dispatch luc 16:30 va 23:30 gio VN (job "SG Do so lieu ..."). KHONG co `schedule`.
# Doc API chinh chu 5 kenh -> ghi sg_so_lieu / sg_so_kenh qua cong sg-cong (viec ghi_so_lieu). Khong in token, khong in so tung bai.
on:
  workflow_dispatch:
    inputs:
      che_do:
        description: "that = ghi vao so; thu = chi in tom tat"
        required: true
        type: choice
        default: that
        options: [that, thu]
permissions: {}
concurrency:
  group: do-so-lieu
  cancel-in-progress: false
jobs:
  do-so-lieu:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/do-so-giu-chan'   # TAM: nhanh do de chay thu; Opus bo ve main khi gop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Do so lieu
        timeout-minutes: 12   # job 15: du de buoc bao loi cuoi van chay khi do qua gio
        env:
          SG_CONG_KHOA: ${{ secrets.SG_CONG_KHOA }}
          ZERNIO_KHOA: ${{ secrets.ZERNIO_KHOA }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          CHE_DO: ${{ inputs.che_do }}
          DA_BAO_FILE: ${{ runner.temp }}/do-so-da-bao   # chay.py tao file nay khi ntfy da gui THANH CONG
        run: |
          set -euo pipefail
          python -m do_so.chay --che-do "$CHE_DO"
      - name: Bao loi workflow (setup / het gio / loi ngoai script)
        if: failure()
        env:
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          DA_BAO_FILE: ${{ runner.temp }}/do-so-da-bao
          LIEN_KET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -e "$DA_BAO_FILE" ]; then echo "da bao ntfy trong script"; exit 0; fi
          python -c "import os; from dang import ntfy; l = os.environ['LIEN_KET']; ntfy.loi('Đo số liệu Săn Game: workflow lỗi', l, click=l)"
