name: Kiem gio dang
# cron-job.org goi workflow_dispatch luc gio dang + 15 phut (07:45 / 12:15 / 20:15). KHONG co `schedule`.
on:
  workflow_dispatch:
    inputs:
      dang:
        required: true
        type: choice
        options: [tin-nhanh, top5, keo-thom-2, keo-thom, keo-thom-3]
      ngay:
        description: "Ngay DANG (gio VN) YYYY-MM-DD. De trong = hom nay gio VN (lich cron-job.org gui rong)"
        required: false
        type: string
      che_do:
        required: true
        type: choice
        options: [thu, that]
permissions: {}
concurrency:
  group: kiem-gio-${{ inputs.ngay }}-${{ inputs.dang }}-${{ inputs.che_do }}
  cancel-in-progress: false
env:
  SG_KENH_BAT: ${{ vars.SG_KENH_BAT }}   # 24/10/2026: rong = moi kenh

jobs:
  kiem-gio:
    if: github.ref == 'refs/heads/main' && (inputs.che_do != 'that' || vars.SG_DANG_BAT == '' || contains(format(',{0},', vars.SG_DANG_BAT), format(',{0},', inputs.dang)))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Kiem gio
        env:
          SG_CONG_KHOA: ${{ secrets.SG_CONG_KHOA }}
          NTFY_TIN: ${{ secrets.NTFY_TIN }}
          NTFY_BAO_LOI: ${{ secrets.NTFY_BAO_LOI }}
          ZERNIO_KHOA: ${{ secrets.ZERNIO_KHOA }}   # 13/10: chi de bu link TikTok con thieu trong so (chay.bu_link_tiktok)
          NGAY: ${{ inputs.ngay }}
          DANG: ${{ inputs.dang }}
          CHE_DO: ${{ inputs.che_do }}
        run: |
          set -euo pipefail
          NGAY="${NGAY:-$(TZ=Asia/Ho_Chi_Minh date +%F)}"; [[ "$NGAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "ngay sai"; exit 1; }
          python -m dang.chay --pha kiem-gio --dang "$DANG" --ngay "${NGAY:-$(TZ=Asia/Ho_Chi_Minh date +%F)}" --che-do "$CHE_DO"
